services:
  app:
    build: .
    ports:
      # Laboratoire : accessible uniquement depuis la machine locale
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
    depends_on:
      - db
  db:
    image: "mongo:4.4"
    environment:
      - MONGO_INITDB_DATABASE=TIWAP
      - MONGO_INITDB_ROOT_USERNAME=username
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    # Pas de section ports : MongoDB reste joignable par "db" sur le réseau Compose uniquement
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    depends_on:
      - app
    volumes:
      - ./reports:/zap/wrk/:rw
    entrypoint: ["sleep", "infinity"]
